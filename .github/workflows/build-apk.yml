yaml
name: Build FilimeXYZ APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the repository
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install Android API 35
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 5. Install Gradle 8.9
      - name: Install Gradle 8.9
        run: |
          curl -fsSL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip

          sudo unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      # 6. Check the project
      - name: Check project
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== PROJECT FILES ====="
          find . -maxdepth 4 -type f | sort

          echo "===== ROOT BUILD.GRADLE ====="
          cat build.gradle

          echo "===== SETTINGS.GRADLE ====="
          cat settings.gradle

          echo "===== APP BUILD.GRADLE ====="
          cat app/build.gradle

      # 7. Clean
      - name: Clean project
        run: |
          gradle clean --stacktrace --no-daemon

      # 8. Build Debug APK
      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # 9. Build Release APK
      - name: Build Release APK
        run: |
          gradle :app:assembleRelease \
            --stacktrace \
            --no-daemon

      # 10. Show generated APKs
      - name: Show APK files
        run: |
          echo "===== GENERATED APK FILES ====="
          find app/build/outputs -type f -name "*.apk" -print

      # 11. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FilimeXYZ-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 12. Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FilimeXYZ-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

